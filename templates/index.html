<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>한글 수식 변환기</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    background: #f7f7f9;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-top: 0; line-height: 1.6; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 20px;
    margin-top: 16px;
  }
  textarea {
    width: 100%;
    height: 320px;
    font-family: "D2Coding", Consolas, monospace;
    font-size: 14px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    resize: vertical;
  }
  .row { display: flex; gap: 12px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  input[type=text] {
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    width: 220px;
  }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #93b4f0; cursor: default; }
  button:hover:not(:disabled) { background: #1d4ed8; }
  .hint {
    font-size: 12.5px;
    color: #777;
    margin-top: 10px;
    line-height: 1.7;
  }
  .hint code { background: #f1f1f4; padding: 1px 5px; border-radius: 4px; }
  #status { margin-top: 10px; font-size: 13.5px; }
  #status.error { color: #c0392b; }
  #status.ok { color: #1a7f37; }
</style>
</head>
<body>
  <h1>한글 수식 변환기</h1>
  <p class="desc">
    LaTeX 수식이 섞인 텍스트를 입력하면, 한글(HWP) 수식편집기로 편집 가능한 네이티브 수식이 삽입된
    hwpx 파일을 만들어 다운로드합니다.
  </p>

  <div class="card">
    <form id="convertForm">
      <textarea id="text" name="text" placeholder="예시:
1. 다음 이차방정식의 해를 구하시오.

$x^2 - 3x + 2 = 0$

풀이: 근의 공식에 의해 $x = \frac{3 \pm \sqrt{9-8}}{2}$ 이므로 $x=1$ 또는 $x=2$ 이다.

$$\int_0^1 x^2 \, dx = \frac{1}{3}$$"></textarea>

      <div class="row">
        <label for="filename">파일 이름</label>
        <input type="text" id="filename" name="filename" value="output" placeholder="output">
        <button type="submit" id="submitBtn">hwpx로 변환 & 다운로드</button>
      </div>
    </form>
    <div id="status"></div>
    <div class="hint">
      수식은 <code>$...$</code>(인라인) 또는 <code>$$...$$</code>, <code>\[...\]</code>, <code>\(...\)</code> 로 감싸서 입력하세요.
      그 외 텍스트는 일반 문단으로 삽입됩니다. 분수(<code>\frac</code>), 근호(<code>\sqrt</code>), 위/아래첨자,
      그리스문자, 적분/급수/극한, 행렬/케이스, <code>\text{}</code> 등을 지원합니다.
    </div>
  </div>

  <script>
    const form = document.getElementById('convertForm');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.className = '';
      statusEl.textContent = '';
      const text = document.getElementById('text').value;
      const filename = document.getElementById('filename').value || 'output';

      if (!text.trim()) {
        statusEl.className = 'error';
        statusEl.textContent = '변환할 텍스트를 입력해주세요.';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = '한글 프로그램에서 수식을 생성하는 중입니다... (수 초 소요될 수 있습니다)';

      try {
        const res = await fetch('/convert', {
          method: 'POST',
          body: new URLSearchParams({ text, filename }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || ('서버 오류 (' + res.status + ')'));
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename.endsWith('.hwpx') ? filename : filename + '.hwpx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusEl.className = 'ok';
        statusEl.textContent = '변환이 완료되어 다운로드했습니다.';
      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
